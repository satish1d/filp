<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <!-- Purple Blue Gradient Background -->
  <defs>
    <linearGradient id="doorlockBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="20" fill="url(#doorlockBg)"/>

  <!-- Native Smart Door Lock & App Phone -->
  <g transform="translate(18, 16)">
    <!-- Smartphone Screen on Left -->
    <rect x="0" y="24" width="30" height="52" rx="4" fill="#1e1b4b" stroke="#818cf8" stroke-width="1"/>
    <rect x="2" y="27" width="26" height="46" rx="2" fill="#e0e7ff"/>
    <circle cx="15" cy="40" r="5" fill="#4f46e5"/>

    <!-- Smart Digital Door Lock Handle on Right -->
    <rect x="42" y="4" width="32" height="74" rx="6" fill="#18181b" stroke="#71717a" stroke-width="1.5"/>
    <!-- Keypad Screen -->
    <rect x="46" y="10" width="24" height="26" rx="3" fill="#09090b"/>
    <circle cx="52" cy="18" r="2" fill="#38bdf8"/>
    <circle cx="58" cy="18" r="2" fill="#38bdf8"/>
    <circle cx="64" cy="18" r="2" fill="#38bdf8"/>
    <!-- Lever Handle -->
    <rect x="26" y="44" width="42" height="10" rx="3" fill="#27272a"/>
    <circle cx="58" cy="49" r="3.5" fill="#38bdf8"/>
  </g>

  <!-- Green Pill Badge at Bottom: BUY NOW -->
  <rect x="16" y="94" width="88" height="20" rx="5" fill="#059669"/>
  <text x="60" y="108" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">BUY NOW</text>
</svg>
