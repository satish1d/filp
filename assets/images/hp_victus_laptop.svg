<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 550" width="100%" height="100%">
  <defs>
    <linearGradient id="screenBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#120c18"/>
      <stop offset="35%" stop-color="#2a0d14"/>
      <stop offset="70%" stop-color="#3d121c"/>
      <stop offset="100%" stop-color="#1a0a10"/>
    </linearGradient>
    <linearGradient id="chassisDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3d42"/>
      <stop offset="50%" stop-color="#282a2e"/>
      <stop offset="100%" stop-color="#1e2023"/>
    </linearGradient>
    <linearGradient id="trackpadGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e3135"/>
      <stop offset="100%" stop-color="#222427"/>
    </linearGradient>
    <linearGradient id="keyGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#39e75f"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="laptopShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Laptop Base Shadow -->
  <ellipse cx="300" cy="460" rx="270" ry="24" fill="#000000" opacity="0.32"/>
  <ellipse cx="300" cy="455" rx="240" ry="16" fill="#000000" opacity="0.45"/>

  <!-- Laptop Group -->
  <g filter="url(#laptopShadow)">
    <!-- ================= 1. Display Lid / Screen ================= -->
    <g transform="translate(80, 185)">
      <!-- Outer Display Bezel -->
      <path d="M 0 0 L 440 0 L 434 -150 L 6 -150 Z" fill="#181a1d" stroke="#2c2f34" stroke-width="2"/>
      <rect x="10" y="-146" width="420" height="142" rx="4" fill="#0d0e11"/>
      
      <!-- Screen Display Area -->
      <rect x="14" y="-142" width="412" height="134" rx="2" fill="url(#screenBg)"/>
      
      <!-- Screen Ambient Art / Background Glow -->
      <circle cx="210" cy="-75" r="80" fill="#e11d48" opacity="0.18"/>
      <circle cx="270" cy="-60" r="60" fill="#f97316" opacity="0.15"/>

      <!-- NEW LAUNCH Red-Orange Banner (Top Right) -->
      <g transform="translate(230, -142)">
        <polygon points="0,0 20,-16 204,-16 184,0" fill="#c2410c"/>
        <polygon points="18,0 35,-16 198,-16 182,0" fill="#ea580c"/>
        <!-- Ribbon Shape -->
        <path d="M 15 0 L 35 -14 L 195 -14 L 180 0 Z" fill="#f97316"/>
        <path d="M 12 0 L 190 0 L 175 16 L 0 16 Z" fill="#e11d48"/>
        <text x="95" y="12" font-family="'Inter', sans-serif" font-weight="900" font-size="12" fill="#ffffff" letter-spacing="1.2" text-anchor="middle">NEW LAUNCH</text>
      </g>

      <!-- 14th Gen Badge (Top Left) -->
      <g transform="translate(18, -135)">
        <polygon points="0,0 80,0 0,80" fill="#ea580c" opacity="0.85"/>
        <text x="6" y="24" font-family="Arial Black, Impact, sans-serif" font-size="24" font-weight="900" fill="#000000">14<tspan font-size="14">th</tspan></text>
        <text x="6" y="38" font-family="'Inter', sans-serif" font-size="11" font-weight="900" fill="#000000">Gen</text>
      </g>

      <!-- Center VICTUS Big Orange 'V' -->
      <g transform="translate(205, -95)">
        <!-- Giant Orange Chevron V -->
        <polygon points="-40,-15 0,30 40,-15 25,-15 0,14 -25,-15" fill="#f97316"/>
        <polygon points="-30,-15 0,20 30,-15 22,-15 0,10 -22,-15" fill="#fb923c"/>
        <text x="0" y="44" font-family="'Inter', sans-serif" font-weight="800" font-size="13" fill="#ffffff" letter-spacing="3" text-anchor="middle">VICTUS</text>
      </g>

      <!-- Intel Core i7 Badge (Right of Victus) -->
      <g transform="translate(285, -120)">
        <rect x="0" y="0" width="62" height="42" rx="3" fill="#0066cc"/>
        <text x="31" y="14" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">intel.</text>
        <text x="31" y="27" font-family="'Inter', sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">CORE</text>
        <text x="50" y="38" font-family="'Inter', sans-serif" font-size="10" font-weight="800" fill="#99ccff">i7</text>
      </g>

      <!-- 5 Feature Badge Cards at bottom of screen -->
      <g transform="translate(20, -42)">
        <!-- 1. 144Hz Display -->
        <rect x="0" y="0" width="56" height="36" rx="2" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
        <text x="28" y="16" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="11" fill="#ea580c" text-anchor="middle">144<tspan font-size="8">Hz</tspan></text>
        <text x="28" y="27" font-family="'Inter', sans-serif" font-size="6.5" font-weight="700" fill="#64748b" text-anchor="middle">144 Hz</text>
        <text x="28" y="33" font-family="'Inter', sans-serif" font-size="5.5" font-weight="600" fill="#64748b" text-anchor="middle">Display</text>

        <!-- 2. Battery -->
        <g transform="translate(60, 0)">
          <rect x="0" y="0" width="56" height="36" rx="2" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
          <!-- Battery icon -->
          <rect x="23" y="4" width="10" height="14" rx="1.5" fill="#22c55e"/>
          <rect x="26" y="2" width="4" height="2" fill="#22c55e"/>
          <polygon points="28,7 26,11 28,11 27,15 31,10 29,10" fill="#ffffff"/>
          <text x="28" y="26" font-family="'Inter', sans-serif" font-size="5.5" font-weight="700" fill="#334155" text-anchor="middle">4-cell, 70 Wh</text>
          <text x="28" y="32" font-family="'Inter', sans-serif" font-size="5" font-weight="600" fill="#64748b" text-anchor="middle">Li-ion Polymer</text>
        </g>

        <!-- 3. NVIDIA RTX -->
        <g transform="translate(120, 0)">
          <rect x="0" y="0" width="56" height="36" rx="2" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
          <rect x="15" y="4" width="26" height="10" rx="1" fill="#76b900"/>
          <text x="28" y="11.5" font-family="sans-serif" font-size="6" font-weight="900" fill="#000" text-anchor="middle">GEFORCE</text>
          <text x="28" y="25" font-family="'Inter', sans-serif" font-size="6.5" font-weight="800" fill="#1e293b" text-anchor="middle">6 GB</text>
          <text x="28" y="32" font-family="'Inter', sans-serif" font-size="5.5" font-weight="700" fill="#475569" text-anchor="middle">RTX™ 4050</text>
        </g>

        <!-- 4. Enhanced Thermals -->
        <g transform="translate(180, 0)">
          <rect x="0" y="0" width="56" height="36" rx="2" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
          <!-- Snowflake / Fan icon -->
          <circle cx="28" cy="11" r="7" fill="#ea580c"/>
          <circle cx="28" cy="11" r="2" fill="#ffffff"/>
          <text x="28" y="26" font-family="'Inter', sans-serif" font-size="5.5" font-weight="700" fill="#1e293b" text-anchor="middle">Enhanced</text>
          <text x="28" y="32" font-family="'Inter', sans-serif" font-size="5.5" font-weight="600" fill="#64748b" text-anchor="middle">Thermals</text>
        </g>

        <!-- 5. DTS:X Ultra -->
        <g transform="translate(240, 0)">
          <rect x="0" y="0" width="56" height="36" rx="2" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
          <text x="28" y="15" font-family="'Inter', sans-serif" font-size="11" font-weight="900" fill="#f97316" text-anchor="middle">dts</text>
          <text x="28" y="26" font-family="'Inter', sans-serif" font-size="6" font-weight="800" fill="#334155" text-anchor="middle">DTS:X®</text>
          <text x="28" y="32" font-family="'Inter', sans-serif" font-size="5" font-weight="600" fill="#64748b" text-anchor="middle">Ultra Audio</text>
        </g>
      </g>

      <!-- Victus small V emblem on bezel -->
      <polygon points="215,8 225,8 220,13" fill="#64748b"/>
    </g>

    <!-- ================= 2. Laptop Keyboard Deck / Lower Chassis ================= -->
    <g transform="translate(15, 185)">
      <!-- Keyboard Base Perspective Trapzoid -->
      <polygon points="65,0 505,0 570,240 0,240" fill="url(#chassisDark)" stroke="#374151" stroke-width="1.5"/>

      <!-- Hinge Area -->
      <rect x="68" y="0" width="434" height="6" fill="#111215"/>

      <!-- Keyboard Recess Well -->
      <polygon points="80,12 490,12 525,145 45,145" fill="#1a1c1f"/>

      <!-- Full Backlit RGB Keyboard Grid -->
      <g stroke="url(#keyGlow)" stroke-width="1.2" fill="#202327">
        <!-- Function Row -->
        <g transform="translate(85, 16)">
          <rect x="0" y="0" width="24" height="12" rx="2"/>
          <rect x="27" y="0" width="24" height="12" rx="2"/>
          <rect x="54" y="0" width="24" height="12" rx="2"/>
          <rect x="81" y="0" width="24" height="12" rx="2"/>
          <rect x="110" y="0" width="24" height="12" rx="2"/>
          <rect x="137" y="0" width="24" height="12" rx="2"/>
          <rect x="164" y="0" width="24" height="12" rx="2"/>
          <rect x="191" y="0" width="24" height="12" rx="2"/>
          <rect x="220" y="0" width="24" height="12" rx="2"/>
          <rect x="247" y="0" width="24" height="12" rx="2"/>
          <rect x="274" y="0" width="24" height="12" rx="2"/>
          <rect x="301" y="0" width="24" height="12" rx="2"/>
          <rect x="330" y="0" width="30" height="12" rx="2"/>
          <rect x="363" y="0" width="32" height="12" rx="2"/>
        </g>

        <!-- Number Row -->
        <g transform="translate(80, 32)">
          <rect x="0" y="0" width="24" height="16" rx="2"/>
          <rect x="27" y="0" width="24" height="16" rx="2"/>
          <rect x="54" y="0" width="24" height="16" rx="2"/>
          <rect x="81" y="0" width="24" height="16" rx="2"/>
          <rect x="108" y="0" width="24" height="16" rx="2"/>
          <rect x="135" y="0" width="24" height="16" rx="2"/>
          <rect x="162" y="0" width="24" height="16" rx="2"/>
          <rect x="189" y="0" width="24" height="16" rx="2"/>
          <rect x="216" y="0" width="24" height="16" rx="2"/>
          <rect x="243" y="0" width="24" height="16" rx="2"/>
          <rect x="270" y="0" width="24" height="16" rx="2"/>
          <rect x="297" y="0" width="24" height="16" rx="2"/>
          <rect x="324" y="0" width="36" height="16" rx="2"/>
          <!-- Numpad -->
          <rect x="363" y="0" width="20" height="16" rx="2"/>
          <rect x="386" y="0" width="20" height="16" rx="2"/>
          <rect x="409" y="0" width="20" height="16" rx="2"/>
        </g>

        <!-- QWERTY Row -->
        <g transform="translate(74, 52)">
          <rect x="0" y="0" width="32" height="18" rx="2"/>
          <rect x="35" y="0" width="24" height="18" rx="2"/>
          <rect x="62" y="0" width="24" height="18" rx="2"/>
          <rect x="89" y="0" width="24" height="18" rx="2"/>
          <rect x="116" y="0" width="24" height="18" rx="2"/>
          <rect x="143" y="0" width="24" height="18" rx="2"/>
          <rect x="170" y="0" width="24" height="18" rx="2"/>
          <rect x="197" y="0" width="24" height="18" rx="2"/>
          <rect x="224" y="0" width="24" height="18" rx="2"/>
          <rect x="251" y="0" width="24" height="18" rx="2"/>
          <rect x="278" y="0" width="24" height="18" rx="2"/>
          <rect x="305" y="0" width="32" height="18" rx="2"/>
          <!-- Numpad -->
          <rect x="372" y="0" width="21" height="18" rx="2"/>
          <rect x="396" y="0" width="21" height="18" rx="2"/>
          <rect x="420" y="0" width="21" height="18" rx="2"/>
        </g>

        <!-- Home Row (ASDF) -->
        <g transform="translate(68, 74)">
          <rect x="0" y="0" width="38" height="19" rx="2"/>
          <rect x="41" y="0" width="25" height="19" rx="2"/>
          <rect x="69" y="0" width="25" height="19" rx="2"/>
          <rect x="97" y="0" width="25" height="19" rx="2"/>
          <rect x="125" y="0" width="25" height="19" rx="2"/>
          <rect x="153" y="0" width="25" height="19" rx="2"/>
          <rect x="181" y="0" width="25" height="19" rx="2"/>
          <rect x="209" y="0" width="25" height="19" rx="2"/>
          <rect x="237" y="0" width="25" height="19" rx="2"/>
          <rect x="265" y="0" width="25" height="19" rx="2"/>
          <rect x="293" y="0" width="46" height="19" rx="2"/>
          <!-- Numpad -->
          <rect x="382" y="0" width="22" height="19" rx="2"/>
          <rect x="407" y="0" width="22" height="19" rx="2"/>
          <rect x="432" y="0" width="22" height="19" rx="2"/>
        </g>

        <!-- Shift / ZXCV Row -->
        <g transform="translate(60, 97)">
          <rect x="0" y="0" width="48" height="20" rx="2"/>
          <rect x="51" y="0" width="26" height="20" rx="2"/>
          <rect x="80" y="0" width="26" height="20" rx="2"/>
          <rect x="109" y="0" width="26" height="20" rx="2"/>
          <rect x="138" y="0" width="26" height="20" rx="2"/>
          <rect x="167" y="0" width="26" height="20" rx="2"/>
          <rect x="196" y="0" width="26" height="20" rx="2"/>
          <rect x="225" y="0" width="26" height="20" rx="2"/>
          <rect x="254" y="0" width="26" height="20" rx="2"/>
          <rect x="283" y="0" width="26" height="20" rx="2"/>
          <rect x="312" y="0" width="48" height="20" rx="2"/>
          <!-- Numpad -->
          <rect x="394" y="0" width="23" height="20" rx="2"/>
          <rect x="420" y="0" width="23" height="20" rx="2"/>
          <rect x="446" y="0" width="23" height="20" rx="2"/>
        </g>

        <!-- Bottom Spacebar Row -->
        <g transform="translate(52, 121)">
          <rect x="0" y="0" width="30" height="20" rx="2"/>
          <rect x="33" y="0" width="26" height="20" rx="2"/>
          <rect x="62" y="0" width="30" height="20" rx="2"/>
          <!-- Spacebar with vibrant glow -->
          <rect x="95" y="0" width="170" height="20" rx="2" stroke="#39e75f" stroke-width="2"/>
          <rect x="268" y="0" width="28" height="20" rx="2"/>
          <rect x="299" y="0" width="28" height="20" rx="2"/>
          <rect x="330" y="0" width="32" height="20" rx="2"/>
          <!-- Arrow keys -->
          <rect x="368" y="5" width="20" height="15" rx="2"/>
          <rect x="391" y="0" width="20" height="10" rx="2"/>
          <rect x="391" y="10" width="20" height="10" rx="2"/>
          <rect x="414" y="5" width="20" height="15" rx="2"/>
          <!-- Numpad zero -->
          <rect x="445" y="0" width="36" height="20" rx="2"/>
        </g>
      </g>

      <!-- VICTUS Subtle Branding on Palmrest -->
      <text x="50" y="185" font-family="'Inter', sans-serif" font-weight="700" font-size="8" fill="#4b5563" letter-spacing="1.5">VICTUS</text>

      <!-- Large Center Dark Trackpad -->
      <rect x="195" y="152" width="180" height="80" rx="4" fill="url(#trackpadGrad)" stroke="#374151" stroke-width="1.2"/>
    </g>

    <!-- Front Lip Chamfer & Highlights -->
    <path d="M 15 425 L 585 425 L 575 432 L 25 432 Z" fill="#17191c"/>
  </g>
</svg>
