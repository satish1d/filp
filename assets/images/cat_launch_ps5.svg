<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <!-- Blue Cosmic Gradient Background -->
  <defs>
    <linearGradient id="ps5Bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="60%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="20" fill="url(#ps5Bg)"/>

  <!-- PS5 Console & DualSense Controller -->
  <g transform="translate(15, 12)">
    <!-- Console Base & Vertical Shell -->
    <path d="M 50 10 Q 56 3 66 12 L 64 78 Q 55 84 46 78 Z" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <!-- Black core -->
    <path d="M 54 14 L 62 14 L 60 76 L 52 76 Z" fill="#0f172a"/>
    <!-- Glowing blue LED light -->
    <line x1="53" y1="16" x2="52" y2="74" stroke="#38bdf8" stroke-width="1.5"/>

    <!-- Controller on Left -->
    <g transform="translate(5, 52) scale(0.65)">
      <path d="M 5 15 C 5 0, 45 0, 45 15 C 45 25, 40 38, 38 42 C 34 50, 28 42, 25 36 C 22 42, 16 50, 12 42 C 10 38, 5 25, 5 15 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <path d="M 12 18 C 16 26, 34 26, 38 18 Z" fill="#0f172a"/>
      <!-- D-Pad and Buttons -->
      <circle cx="15" cy="14" r="2.5" fill="#334155"/>
      <circle cx="35" cy="14" r="2.5" fill="#334155"/>
      <!-- Thumbsticks -->
      <circle cx="18" cy="28" r="4.5" fill="#0f172a"/>
      <circle cx="32" cy="28" r="4.5" fill="#0f172a"/>
    </g>
  </g>

  <!-- Green Pill Badge at Bottom: BUY NOW -->
  <rect x="16" y="94" width="88" height="20" rx="5" fill="#059669"/>
  <text x="60" y="108" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">BUY NOW</text>
</svg>
