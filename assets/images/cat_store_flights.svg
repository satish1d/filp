<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <rect width="120" height="120" rx="24" fill="#e0f2fe"/>
  <!-- Clouds -->
  <ellipse cx="30" cy="85" rx="25" ry="14" fill="#ffffff" opacity="0.8"/>
  <ellipse cx="90" cy="40" rx="28" ry="16" fill="#ffffff" opacity="0.8"/>
  
  <!-- IndiGo Airplane -->
  <g transform="translate(60, 60) rotate(-15) scale(0.9)">
    <!-- Plane Fuselage -->
    <path d="M -45 0 L 25 -4 Q 45 -4 48 0 Q 45 4 25 4 L -45 0 Z" fill="#ffffff" stroke="#001b94" stroke-width="1.5"/>
    <!-- Cockpit Window -->
    <polygon points="35,-2 40,-1 38,0 34,0" fill="#0284c7"/>
    <!-- Tail Fin (Indigo Blue) -->
    <polygon points="-45,0 -55,-22 -35,-2 -40,0" fill="#001b94"/>
    <!-- Main Wings -->
    <polygon points="-8,-3 8,-28 16,-28 -2,-3" fill="#001b94"/>
    <polygon points="-8,3 8,28 16,28 -2,3" fill="#001b94"/>
    <!-- Jet Engine -->
    <rect x="-2" y="10" width="12" height="5" rx="2.5" fill="#475569"/>
    <!-- IndiGo Text -->
    <text x="0" y="2" font-family="-apple-system, sans-serif" font-size="5" font-weight="900" font-style="italic" fill="#001b94" text-anchor="middle">IndiGo</text>
  </g>
</svg>
