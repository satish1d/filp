<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <!-- Light Grey Gradient Background -->
  <defs>
    <linearGradient id="fitbitBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="20" fill="url(#fitbitBg)"/>

  <!-- Blue Fabric Fitbit Loop Band -->
  <g transform="translate(60, 50)">
    <!-- Band Oval loop -->
    <ellipse cx="0" cy="0" rx="26" ry="36" fill="none" stroke="#60a5fa" stroke-width="12" stroke-linecap="round"/>
    <ellipse cx="0" cy="0" rx="26" ry="36" fill="none" stroke="#3b82f6" stroke-width="4" stroke-dasharray="2 2"/>
    <!-- Metal clasp on top -->
    <rect x="-8" y="-38" width="16" height="8" rx="2" fill="#94a3b8"/>
  </g>

  <!-- Green Pill Badge at Bottom: SALE IS LIVE -->
  <rect x="12" y="94" width="96" height="20" rx="5" fill="#047857"/>
  <text x="60" y="108" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.3">SALE IS LIVE</text>
</svg>
