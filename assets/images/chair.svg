<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgRoom" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8f9fa"/>
      <stop offset="100%" stop-color="#e9ecef"/>
    </linearGradient>
    <linearGradient id="leatherGrey" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#707b88"/>
      <stop offset="50%" stop-color="#555f6c"/>
      <stop offset="100%" stop-color="#414a56"/>
    </linearGradient>
    <linearGradient id="chromeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d0d7de"/>
      <stop offset="30%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#8c959f"/>
      <stop offset="100%" stop-color="#e1e4e8"/>
    </linearGradient>
    <filter id="chairShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background Room Decor -->
  <rect width="400" height="400" fill="url(#bgRoom)"/>
  
  <!-- Wooden floor & baseboard line -->
  <line x1="0" y1="330" x2="400" y2="330" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="0" y="330" width="400" height="70" fill="#f1f3f5"/>
  
  <!-- Desk on right background -->
  <rect x="330" y="160" width="70" height="170" fill="#dfd7ca" opacity="0.6"/>
  <line x1="330" y1="160" x2="400" y2="160" stroke="#8d7358" stroke-width="6"/>
  <rect x="345" y="180" width="15" height="150" fill="#24292f"/>

  <!-- Plant on left background -->
  <g transform="translate(10, 150)">
    <path d="M 20 180 L 15 130 L 35 130 L 30 180 Z" fill="#9c836a"/>
    <!-- Leaves -->
    <ellipse cx="15" cy="115" rx="10" ry="20" fill="#38a169" transform="rotate(-30 15 115)"/>
    <ellipse cx="30" cy="100" rx="9" ry="22" fill="#2f855a" transform="rotate(15 30 100)"/>
    <ellipse cx="10" cy="85" rx="8" ry="18" fill="#48bb78" transform="rotate(-45 10 85)"/>
    <ellipse cx="35" cy="75" rx="9" ry="20" fill="#276749" transform="rotate(35 35 75)"/>
  </g>

  <!-- Chair Shadow -->
  <ellipse cx="200" cy="355" rx="100" ry="16" fill="#000000" opacity="0.16"/>

  <!-- Office Chair Main Assembly -->
  <g filter="url(#chairShadow)">
    <!-- 5-Star Chrome Base & Wheels -->
    <g transform="translate(200, 325)">
      <!-- Chrome Center Hub & Gas Lift Cylinder -->
      <rect x="-10" y="-55" width="20" height="55" fill="url(#chromeGrad)" rx="2"/>
      <rect x="-14" y="-15" width="28" height="20" fill="#24292f" rx="3"/>
      <ellipse cx="0" cy="5" rx="18" ry="8" fill="url(#chromeGrad)"/>
      
      <!-- 5 Legs -->
      <path d="M 0 5 Q -40 8 -80 18" stroke="url(#chromeGrad)" stroke-width="12" stroke-linecap="round" fill="none"/>
      <path d="M 0 5 Q -25 15 -45 28" stroke="url(#chromeGrad)" stroke-width="12" stroke-linecap="round" fill="none"/>
      <path d="M 0 5 Q 0 18 0 32" stroke="url(#chromeGrad)" stroke-width="12" stroke-linecap="round" fill="none"/>
      <path d="M 0 5 Q 25 15 45 28" stroke="url(#chromeGrad)" stroke-width="12" stroke-linecap="round" fill="none"/>
      <path d="M 0 5 Q 40 8 80 18" stroke="url(#chromeGrad)" stroke-width="12" stroke-linecap="round" fill="none"/>

      <!-- Dual Caster Wheels -->
      <g fill="#24292f">
        <circle cx="-80" cy="22" r="8"/>
        <circle cx="-45" cy="32" r="8"/>
        <circle cx="0" cy="36" r="8"/>
        <circle cx="45" cy="32" r="8"/>
        <circle cx="80" cy="22" r="8"/>
      </g>
    </g>

    <!-- Padded Seat -->
    <g transform="translate(200, 260)">
      <!-- Bottom seat cushion -->
      <path d="M -75 -15 Q 0 -5 75 -15 Q 85 10 70 20 Q 0 26 -70 20 Q -85 10 -75 -15 Z" fill="url(#leatherGrey)"/>
      <path d="M -70 -12 Q 0 -2 70 -12 Q 65 5 0 8 Q -65 5 -70 -12 Z" fill="#606b78"/>
    </g>

    <!-- Curved Ergonomic High Backrest -->
    <g transform="translate(200, 155)">
      <!-- Backrest Outer Shell -->
      <path d="M -60 -95 Q 0 -105 60 -95 C 75 -50 78 30 65 95 C 20 98 -20 98 -65 95 C -78 30 -75 -50 -60 -95 Z" fill="url(#leatherGrey)"/>
      
      <!-- Ergonomic Lumbar & Cushion Segments -->
      <!-- Headrest Pad -->
      <rect x="-45" y="-85" width="90" height="40" rx="8" fill="#626e7b" stroke="#3d4651" stroke-width="1.5"/>
      <!-- Upper Back Section -->
      <rect x="-50" y="-38" width="100" height="55" rx="8" fill="#586370" stroke="#3d4651" stroke-width="1.5"/>
      <!-- Lumbar Support Section -->
      <rect x="-48" y="24" width="96" height="52" rx="8" fill="#525c68" stroke="#3d4651" stroke-width="1.5"/>

      <!-- Vertical stitch details -->
      <line x1="0" y1="-85" x2="0" y2="76" stroke="#38404a" stroke-width="1.5" stroke-dasharray="4, 3"/>
      <line x1="-22" y1="-38" x2="-22" y2="76" stroke="#38404a" stroke-width="1" stroke-dasharray="3, 3"/>
      <line x1="22" y1="-38" x2="22" y2="76" stroke="#38404a" stroke-width="1" stroke-dasharray="3, 3"/>
    </g>

    <!-- Padded Ergonomic Armrests -->
    <!-- Left Armrest -->
    <path d="M 125 190 Q 115 250 145 265 Q 165 265 170 240 Q 165 200 135 190" fill="url(#chromeGrad)"/>
    <rect x="118" y="185" width="28" height="60" rx="8" fill="#444d58" transform="rotate(-10 132 215)"/>

    <!-- Right Armrest -->
    <path d="M 275 190 Q 285 250 255 265 Q 235 265 230 240 Q 235 200 265 190" fill="url(#chromeGrad)"/>
    <rect x="254" y="185" width="28" height="60" rx="8" fill="#444d58" transform="rotate(10 268 215)"/>
  </g>
</svg>
