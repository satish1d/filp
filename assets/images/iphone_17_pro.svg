<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgIphone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fbf5ee"/>
    </linearGradient>
    <linearGradient id="copperTitanium" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f89858"/>
      <stop offset="40%" stop-color="#d96a29"/>
      <stop offset="80%" stop-color="#b84d12"/>
      <stop offset="100%" stop-color="#8a3406"/>
    </linearGradient>
    <linearGradient id="screenIphone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#140600"/>
      <stop offset="40%" stop-color="#3b1500"/>
      <stop offset="70%" stop-color="#853600"/>
      <stop offset="100%" stop-color="#0a0300"/>
    </linearGradient>
    <filter id="appleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bgIphone)"/>

  <!-- Phone 1 (Back View - Left) -->
  <g transform="translate(18, 25)" filter="url(#appleShadow)">
    <!-- Chassis -->
    <rect x="0" y="0" width="160" height="330" rx="32" fill="url(#copperTitanium)" stroke="#fba76d" stroke-width="2"/>
    
    <!-- Camera Plateau (Square with rounded corners) -->
    <rect x="10" y="10" width="88" height="92" rx="24" fill="#eb7834" stroke="#c05719" stroke-width="1.5" opacity="0.9"/>
    
    <!-- 3 Big Pro Camera Lenses -->
    <!-- Top Left Lens -->
    <circle cx="32" cy="34" r="15" fill="#151515" stroke="#fba76d" stroke-width="2"/>
    <circle cx="32" cy="34" r="9" fill="#080808"/>
    <circle cx="30" cy="32" r="3" fill="#38bdf8" opacity="0.6"/>

    <!-- Bottom Left Lens -->
    <circle cx="32" cy="78" r="15" fill="#151515" stroke="#fba76d" stroke-width="2"/>
    <circle cx="32" cy="78" r="9" fill="#080808"/>
    <circle cx="30" cy="76" r="3" fill="#38bdf8" opacity="0.6"/>

    <!-- Right Lens -->
    <circle cx="72" cy="56" r="15" fill="#151515" stroke="#fba76d" stroke-width="2"/>
    <circle cx="72" cy="56" r="9" fill="#080808"/>
    <circle cx="70" cy="54" r="3" fill="#38bdf8" opacity="0.6"/>

    <!-- LiDAR & Flash -->
    <circle cx="72" cy="24" r="5" fill="#ffffff"/>
    <circle cx="72" cy="86" r="4" fill="#151515"/>

    <!-- Apple Logo (Center) -->
    <g transform="translate(80, 165) scale(0.6)" fill="#8a3406" opacity="0.45">
      <path d="M 0 -15 C 3 -19 9 -22 15 -21 C 15 -15 10 -10 5 -9 C 3 -12 0 -15 0 -15 Z"/>
      <path d="M 12 0 C 17 -8 24 -7 28 -4 C 23 4 25 15 32 18 C 28 25 24 30 19 30 C 15 30 13 28 9 28 C 5 28 2 30 -1 30 C -7 30 -13 22 -17 14 C -22 4 -18 -8 -11 -12 C -6 -15 1 -14 5 -12 C 8 -10 10 -10 12 0 Z"/>
    </g>
  </g>

  <!-- Phone 2 (Front View - Right) -->
  <g transform="translate(150, 25)" filter="url(#appleShadow)">
    <!-- Chassis Edge -->
    <rect x="0" y="0" width="160" height="330" rx="32" fill="#000000" stroke="#d96a29" stroke-width="2"/>
    
    <!-- Screen Display -->
    <rect x="3" y="3" width="154" height="324" rx="29" fill="url(#screenIphone)"/>
    
    <!-- Dynamic Island Pill -->
    <rect x="58" y="10" width="38" height="12" rx="6" fill="#000000"/>
    <circle cx="85" cy="16" r="2.5" fill="#08101a"/>

    <!-- Futuristic Amber Fluid Ribbon Wallpaper -->
    <path d="M 0 140 Q 60 70 80 180 T 154 130 L 154 324 L 0 324 Z" fill="#b84d12" opacity="0.4"/>
    <path d="M 20 280 C 40 180 80 160 120 230 C 140 260 154 220 154 200" stroke="#ffaa5e" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.85"/>
    <path d="M 20 280 C 40 180 80 160 120 230 C 140 260 154 220 154 200" stroke="#fff1e0" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 0 200 C 40 240 90 280 140 250" stroke="#e66817" stroke-width="4" fill="none" opacity="0.6"/>

    <!-- Home Indicator Bar -->
    <rect x="55" y="316" width="44" height="3" rx="1.5" fill="#ffffff" opacity="0.7"/>
  </g>
</svg>
