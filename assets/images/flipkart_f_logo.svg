    <linearGradient id="fkBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#024fd3"/>
      <stop offset="100%" stop-color="#013bb5"/>
    </linearGradient>
    <linearGradient id="streakFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#024fd3" stop-opacity="0.1"/>
      <stop offset="60%" stop-color="#024fd3" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#024fd3" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- Speed streaks on left crossbar -->
