<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 115" width="100%" height="100%">
  <!-- Flipkart Iconic Blue 'f' with Speed Streaks (Exact Replica of d2ecfddf891a3922.png) -->
