<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 340" width="100%" height="100%">
  <!-- Card Background -->
  <rect width="280" height="340" rx="16" fill="#e0effe"/>
  
  <!-- Subtle circular background glow -->
  <circle cx="140" cy="180" r="110" fill="#bae6fd" opacity="0.6"/>

  <!-- Modern HP Laptop -->
  <g transform="translate(20, 60)">
    <!-- Screen Shell Back / Bezel -->
    <rect x="25" y="10" width="190" height="120" rx="6" fill="#0f172a" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Screen Display -->
    <rect x="30" y="15" width="180" height="110" rx="4" fill="#ffffff"/>
    
    <!-- HP Circular Logo in Center -->
    <circle cx="120" cy="55" r="18" fill="#0096d6"/>
    <text x="120" y="62" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="900" font-style="italic" fill="#ffffff" text-anchor="middle">hp</text>

    <!-- Intel Core i5 Badge on Screen -->
    <rect x="150" y="38" width="46" height="42" rx="3" fill="#0068b5"/>
    <text x="173" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="7" font-weight="700" fill="#ffffff" text-anchor="middle">intel.</text>
    <text x="173" y="64" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="900" fill="#ffffff" text-anchor="middle">CORE</text>
    <text x="173" y="74" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" font-weight="800" fill="#38bdf8" text-anchor="middle">i5</text>

    <!-- Feature Icons Bar on Screen -->
    <g transform="translate(42, 90)">
      <!-- Intel Graphics -->
      <rect x="0" y="0" width="28" height="24" rx="2" fill="#eff6ff" stroke="#bfdbfe" stroke-width="0.8"/>
      <text x="14" y="11" font-family="sans-serif" font-size="5" font-weight="bold" fill="#0284c7" text-anchor="middle">Intel</text>
      <text x="14" y="18" font-family="sans-serif" font-size="4.5" fill="#475569" text-anchor="middle">Graphics</text>

      <!-- Fast Charge -->
      <rect x="36" y="0" width="28" height="24" rx="2" fill="#eff6ff" stroke="#bfdbfe" stroke-width="0.8"/>
      <text x="50" y="11" font-family="sans-serif" font-size="5" font-weight="bold" fill="#f59e0b" text-anchor="middle">⚡ Fast</text>
      <text x="50" y="18" font-family="sans-serif" font-size="4.5" fill="#475569" text-anchor="middle">Charge</text>

      <!-- Camera with Privacy Shutter -->
      <rect x="72" y="0" width="34" height="24" rx="2" fill="#eff6ff" stroke="#bfdbfe" stroke-width="0.8"/>
      <text x="89" y="11" font-family="sans-serif" font-size="5" font-weight="bold" fill="#0f172a" text-anchor="middle">📷 Camera with</text>
      <text x="89" y="18" font-family="sans-serif" font-size="4" fill="#475569" text-anchor="middle">Privacy Shutter</text>

      <!-- MS Office 365 -->
      <rect x="114" y="0" width="30" height="24" rx="2" fill="#eff6ff" stroke="#bfdbfe" stroke-width="0.8"/>
      <text x="129" y="11" font-family="sans-serif" font-size="5" font-weight="bold" fill="#ea580c" text-anchor="middle">Microsoft</text>
      <text x="129" y="18" font-family="sans-serif" font-size="4.5" fill="#475569" text-anchor="middle">365</text>
    </g>

    <!-- Laptop Base & Keyboard (Perspective Trapeze) -->
    <path d="M 12 130 L 228 130 L 246 195 L -6 195 Z" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5"/>
    <path d="M 22 134 L 218 134 L 234 180 L 6 180 Z" fill="#f1f5f9"/>

    <!-- Trackpad -->
    <rect x="88" y="182" width="64" height="11" rx="2" fill="#94a3b8" opacity="0.6"/>

    <!-- Reflection / Drop Shadow -->
    <ellipse cx="120" cy="202" rx="110" ry="8" fill="#64748b" opacity="0.25"/>
  </g>
</svg>
