<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <!-- Light Studio Background -->
  <rect width="120" height="120" rx="20" fill="#f1f5f9"/>

  <!-- Acer Iconia Tablet with Vivid Colorful Screen -->
  <g transform="translate(32, 12)">
    <!-- Back of Tablet peeking on left -->
    <rect x="-6" y="4" width="48" height="74" rx="4" fill="#334155"/>
    <circle cx="-2" cy="10" r="2.5" fill="#0f172a"/>

    <!-- Front Tablet Display -->
    <rect x="10" y="0" width="52" height="80" rx="4" fill="#09090b" stroke="#334155" stroke-width="1.5"/>
    <rect x="13" y="3" width="46" height="74" rx="2" fill="#0f172a"/>
    
    <!-- Colorful Explosion Wallpaper -->
    <path d="M 13 3 L 59 3 L 59 77 L 13 77 Z" fill="#0284c7"/>
    <path d="M 20 20 Q 40 40 50 15 L 59 50 L 13 60 Z" fill="#ef4444" opacity="0.85"/>
    <path d="M 30 30 Q 55 50 35 70 L 13 77 Z" fill="#f59e0b" opacity="0.85"/>
    <circle cx="36" cy="40" r="12" fill="#a855f7" opacity="0.7"/>
  </g>

  <!-- Green Pill Badge at Bottom: BUY NOW -->
  <rect x="16" y="94" width="88" height="20" rx="5" fill="#059669"/>
  <text x="60" y="108" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">BUY NOW</text>
</svg>
