<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgVivo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fdf2f4"/>
    </linearGradient>
    <linearGradient id="roseBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ea7a88"/>
      <stop offset="40%" stop-color="#c9495c"/>
      <stop offset="80%" stop-color="#a03444"/>
      <stop offset="100%" stop-color="#802030"/>
    </linearGradient>
    <linearGradient id="screenWall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2d050d"/>
      <stop offset="30%" stop-color="#bb2d48"/>
      <stop offset="60%" stop-color="#ff8da1"/>
      <stop offset="85%" stop-color="#e93b60"/>
      <stop offset="100%" stop-color="#150206"/>
    </linearGradient>
    <linearGradient id="cameraModule" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3d121c"/>
      <stop offset="100%" stop-color="#1a050a"/>
    </linearGradient>
    <filter id="phoneShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bgVivo)"/>

  <!-- Phone 1 (Back View - Left) -->
  <g transform="translate(15, 30)" filter="url(#phoneShadow)">
    <!-- Phone Chassis -->
    <rect x="0" y="0" width="155" height="320" rx="26" fill="url(#roseBody)" stroke="#f7aab5" stroke-width="1.5"/>
    
    <!-- Camera Module Island -->
    <rect x="12" y="14" width="60" height="125" rx="30" fill="url(#cameraModule)" stroke="#8e2b3b" stroke-width="1"/>
    
    <!-- Big Top Camera Lens -->
    <circle cx="42" cy="44" r="22" fill="#08080c" stroke="#4a1520" stroke-width="2"/>
    <circle cx="42" cy="44" r="16" fill="#151b28"/>
    <circle cx="42" cy="44" r="9" fill="#050810"/>
    <circle cx="39" cy="41" r="3" fill="#60a5fa" opacity="0.8"/>
    
    <!-- ZEISS Logo on Camera -->
    <rect x="58" y="24" width="10" height="10" rx="2" fill="#002d72"/>
    <text x="63" y="31" font-family="sans-serif" font-size="5" font-weight="bold" fill="#ffffff" text-anchor="middle">Z</text>

    <!-- Ring Aura Light (Bottom of camera island) -->
    <circle cx="42" cy="104" r="15" fill="none" stroke="#fbcfe8" stroke-width="3" opacity="0.9"/>
    <circle cx="42" cy="104" r="8" fill="#1c070c"/>

    <!-- vivo Logo on Back (Vertical) -->
    <text x="24" y="270" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="bold" font-size="14" fill="#ffffff" opacity="0.85" transform="rotate(-90 24 270)" letter-spacing="1">vivo</text>
  </g>

  <!-- Phone 2 (Front Display - Right) -->
  <g transform="translate(145, 30)" filter="url(#phoneShadow)">
    <!-- Black Bezel Frame -->
    <rect x="0" y="0" width="155" height="320" rx="26" fill="#000000" stroke="#c9495c" stroke-width="2"/>
    
    <!-- Curved AMOLED Display Screen with Wallpaper -->
    <rect x="3" y="3" width="149" height="314" rx="23" fill="url(#screenWall)"/>
    
    <!-- Wallpaper Fluid Petal Curves -->
    <path d="M 0 100 C 60 40 120 120 149 70 L 149 314 L 0 314 Z" fill="#c41c40" opacity="0.4"/>
    <path d="M 0 160 C 80 100 90 220 149 180 L 149 314 L 0 314 Z" fill="#ff6b8b" opacity="0.5"/>
    <path d="M 20 220 C 70 170 110 260 149 230" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.7"/>

    <!-- Front Punch Hole Camera -->
    <circle cx="74" cy="18" r="4" fill="#000000"/>
    <circle cx="73" cy="17" r="1.5" fill="#38bdf8" opacity="0.6"/>

    <!-- Model Name on Display -->
    <text x="74" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="18" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">vivo V50</text>
  </g>
</svg>
