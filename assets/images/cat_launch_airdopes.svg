<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <!-- Light Warm Background -->
  <rect width="120" height="120" rx="20" fill="#f8fafc"/>

  <!-- boAt Airdopes Case & Earbuds -->
  <g transform="translate(30, 16)">
    <!-- White Oval Charging Case -->
    <rect x="0" y="24" width="60" height="48" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <ellipse cx="30" cy="24" rx="26" ry="6" fill="#e2e8f0"/>
    <circle cx="30" cy="46" r="2.5" fill="#22c55e"/>

    <!-- Earbuds Standing Above Open Lid -->
    <!-- Left Earbud -->
    <path d="M 16 28 L 16 8 Q 16 2 22 2 Q 28 2 28 8 L 22 28 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Right Earbud -->
    <path d="M 44 28 L 44 8 Q 44 2 38 2 Q 32 2 32 8 L 38 28 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  </g>

  <!-- Green Pill Badge at Bottom: SALE IS LIVE -->
  <rect x="12" y="94" width="96" height="20" rx="5" fill="#047857"/>
  <text x="60" y="108" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.3">SALE IS LIVE</text>
</svg>
