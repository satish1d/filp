<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgLuggage" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f4f6f8"/>
    </linearGradient>
    <linearGradient id="navySuitcase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a4b7c"/>
      <stop offset="40%" stop-color="#1b3660"/>
      <stop offset="100%" stop-color="#122544"/>
    </linearGradient>
    <linearGradient id="trolleyMetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="luggageShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgLuggage)"/>

  <!-- Floor ground shadow -->
  <ellipse cx="230" cy="370" rx="150" ry="14" fill="#000000" opacity="0.18"/>

  <!-- 1. Large Suitcase (Back Left) -->
  <g transform="translate(195, 75)" filter="url(#luggageShadow)">
    <!-- Telescopic Handle -->
    <rect x="22" y="0" width="6" height="60" fill="url(#trolleyMetal)"/>
    <rect x="52" y="0" width="6" height="60" fill="url(#trolleyMetal)"/>
    <rect x="18" y="-5" width="44" height="12" rx="4" fill="#1e293b"/>

    <!-- Suitcase Shell -->
    <g transform="translate(0, 50)">
      <rect x="0" y="0" width="80" height="210" rx="14" fill="url(#navySuitcase)" stroke="#38bdf8" stroke-width="1.5"/>
      <!-- Diagonal Grooves / Textures -->
      <path d="M 10 30 L 40 50 L 70 30" stroke="#0f172a" stroke-width="2.5" fill="none" opacity="0.6"/>
      <path d="M 10 70 L 40 90 L 70 70" stroke="#0f172a" stroke-width="2.5" fill="none" opacity="0.6"/>
      <path d="M 10 110 L 40 130 L 70 110" stroke="#0f172a" stroke-width="2.5" fill="none" opacity="0.6"/>
      <path d="M 10 150 L 40 170 L 70 150" stroke="#0f172a" stroke-width="2.5" fill="none" opacity="0.6"/>
      <!-- Brand Logo Badge -->
      <rect x="30" y="15" width="20" height="8" rx="2" fill="#0284c7"/>
      <text x="40" y="21" font-family="sans-serif" font-size="5" font-weight="bold" fill="#fff" text-anchor="middle">MAGNUM</text>
      <!-- Wheels -->
      <circle cx="15" cy="216" r="6" fill="#0f172a"/>
      <circle cx="65" cy="216" r="6" fill="#0f172a"/>
    </g>
  </g>

  <!-- 2. Medium Suitcase (Back Right) -->
  <g transform="translate(265, 95)" filter="url(#luggageShadow)">
    <!-- Telescopic Handle -->
    <rect x="25" y="0" width="6" height="55" fill="url(#trolleyMetal)"/>
    <rect x="55" y="0" width="6" height="55" fill="url(#trolleyMetal)"/>
    <rect x="20" y="-5" width="46" height="12" rx="4" fill="#1e293b"/>

    <!-- Suitcase Shell -->
    <g transform="translate(0, 45)">
      <rect x="0" y="0" width="86" height="195" rx="14" fill="url(#navySuitcase)" stroke="#38bdf8" stroke-width="1.5"/>
      <!-- Diagonal Grooves -->
      <path d="M 12 30 L 43 50 L 74 30" stroke="#0f172a" stroke-width="2.5" fill="none" opacity="0.6"/>
      <path d="M 12 65 L 43 85 L 74 65" stroke="#0f172a" stroke-width="2.5" fill="none" opacity="0.6"/>
      <path d="M 12 100 L 43 120 L 74 100" stroke="#0f172a" stroke-width="2.5" fill="none" opacity="0.6"/>
      <path d="M 12 135 L 43 155 L 74 135" stroke="#0f172a" stroke-width="2.5" fill="none" opacity="0.6"/>
      <!-- Brand Logo Badge -->
      <rect x="33" y="15" width="20" height="8" rx="2" fill="#0284c7"/>
      <!-- Wheels -->
      <circle cx="16" cy="201" r="6" fill="#0f172a"/>
      <circle cx="70" cy="201" r="6" fill="#0f172a"/>
    </g>
  </g>

  <!-- 3. Cabin / Front Suitcase (Foreground Left) -->
  <g transform="translate(95, 120)" filter="url(#luggageShadow)">
    <!-- Telescopic Handle -->
    <rect x="35" y="0" width="7" height="60" fill="url(#trolleyMetal)"/>
    <rect x="75" y="0" width="7" height="60" fill="url(#trolleyMetal)"/>
    <rect x="28" y="-6" width="60" height="14" rx="4" fill="#1e293b"/>

    <!-- Suitcase Shell -->
    <g transform="translate(0, 50)">
      <rect x="0" y="0" width="118" height="180" rx="16" fill="url(#navySuitcase)" stroke="#38bdf8" stroke-width="2"/>
      
      <!-- Cyan accent zipper line down center / perimeter -->
      <path d="M 59 0 L 59 180" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="3, 2"/>

      <!-- Modern Geometric Textured Diagonal Chevron Grooves -->
      <path d="M 15 35 L 59 60 L 103 35" stroke="#0c192e" stroke-width="3.5" fill="none"/>
      <path d="M 15 35 L 59 60 L 103 35" stroke="#38bdf8" stroke-width="1" fill="none" opacity="0.4"/>

      <path d="M 15 70 L 59 95 L 103 70" stroke="#0c192e" stroke-width="3.5" fill="none"/>
      <path d="M 15 70 L 59 95 L 103 70" stroke="#38bdf8" stroke-width="1" fill="none" opacity="0.4"/>

      <path d="M 15 105 L 59 130 L 103 105" stroke="#0c192e" stroke-width="3.5" fill="none"/>
      <path d="M 15 105 L 59 130 L 103 105" stroke="#38bdf8" stroke-width="1" fill="none" opacity="0.4"/>

      <path d="M 15 140 L 59 165 L 103 140" stroke="#0c192e" stroke-width="3.5" fill="none"/>

      <!-- Brand Badge -->
      <rect x="44" y="16" width="30" height="10" rx="2" fill="#0284c7"/>
      <text x="59" y="24" font-family="sans-serif" font-size="7" font-weight="900" fill="#fff" text-anchor="middle">MAGNUM</text>

      <!-- Corner Protectors -->
      <path d="M 0 20 Q 0 0 20 0" stroke="#0f172a" stroke-width="6" fill="none"/>
      <path d="M 98 0 Q 118 0 118 20" stroke="#0f172a" stroke-width="6" fill="none"/>

      <!-- 4 Dual Spinner Wheels -->
      <g fill="#0f172a">
        <circle cx="20" cy="186" r="8"/>
        <circle cx="20" cy="186" r="3" fill="#38bdf8"/>
        <circle cx="98" cy="186" r="8"/>
        <circle cx="98" cy="186" r="3" fill="#38bdf8"/>
      </g>
    </g>
  </g>
</svg>
