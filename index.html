<!DOCTYPE html>
<html lang="en-IN">

<head>
    <meta charset="UTF-8">
    <script>
        // Suppress external browser extension errors (e.g. MetaMask inpage.js)
        window.addEventListener('error', function(e) {
            if (e && ((e.filename && e.filename.indexOf('chrome-extension://') !== -1) || (e.message && (e.message.indexOf('MetaMask') !== -1 || e.message.indexOf('extension') !== -1)))) {
                e.stopImmediatePropagation();
                e.preventDefault();
                return true;
            }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
            var reason = e && (e.reason || '');
            var msg = typeof reason === 'object' ? (reason.message || reason.stack || '') : String(reason);
            if (msg && (msg.indexOf('MetaMask') !== -1 || msg.indexOf('chrome-extension://') !== -1 || msg.indexOf('extension') !== -1)) {
                e.stopImmediatePropagation();
                e.preventDefault();
                return true;
            }
        }, true);
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#ebf3fe" id="themeColor">
    <title>Flipkart - The Big Billion Days Sale</title>
    <meta name="description" content="Explore The Big Billion Days deals on Flipkart. Live sale discounts on Mobiles, Electronics, Home, and Fashion.">
    <meta property="og:title" content="Flipkart - The Big Billion Days Sale">
    <meta property="og:description" content="Explore The Big Billion Days deals on Flipkart. Live sale discounts on Mobiles, Electronics, Home, and Fashion.">
    
    <link rel="stylesheet" href="./assets/css/custom.css">
</head>

<body>
    <div id="app-container">
        <!-- Top Sky-Blue Header Section -->
        <header class="top-header-section">
            <!-- Brand Switcher Tabs (Flipkart / Travel) -->
            <div class="brand-switcher-tabs">
                <button class="brand-tab flipkart-tab" id="tab-flipkart" aria-label="Flipkart">
                    <img src="./assets/images/flipkart_f_logo.svg" alt="Flipkart" class="tab-icon-top">
                    <span class="tab-text-bottom">Flipkart</span>
                </button>

                <button class="brand-tab travel-tab" id="tab-travel" aria-label="Travel">
                    <svg class="tab-icon-top travel-airplane-icon" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z" fill="#f05537"/>
                    </svg>
                    <span class="tab-text-bottom">Travel</span>
                </button>
            </div>

            <!-- Delivery Location Bar (Exact from IMG_1694.jpg) -->
            <div class="delivery-location-bar">
                <div class="location-pin-icon">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#212121" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                        <circle cx="12" cy="10" r="3"></circle>
                    </svg>
                </div>
                <span class="location-text-title">Location not set</span>
                <button type="button" class="location-action-link" id="btn-select-location">Select delivery location <span style="font-weight: 700; font-size: 14px;">&gt;</span></button>
            </div>

            <!-- Search Bar -->
            <div class="search-bar-wrapper">
                <div class="search-icon-pos">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2874f0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </div>
                <input type="text" id="search-input" class="search-input-box" placeholder="Search for Products" autocomplete="off">
            </div>
        </header>

        <!-- Category Navigation Strip -->
        <nav class="category-nav-strip" id="category-nav">
            <!-- 1. For You -->
            <div class="category-item active" data-category="all">
                <div class="category-icon-box" style="background: #e3edfe;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2874f0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <path d="M16 10a4 4 0 0 1-8 0"></path>
                    </svg>
                </div>
                <span class="category-label">For You</span>
            </div>

            <!-- 2. Fashion -->
            <div class="category-item" data-category="Fashion">
                <div class="category-icon-box" style="background: #f8fafc;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#212121" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20.38 3.46L16 2a4 4 0 0 0-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"></path>
                    </svg>
                </div>
                <span class="category-label">Fashion</span>
            </div>

            <!-- 3. Mobiles -->
            <div class="category-item" data-category="Mobiles">
                <div class="category-icon-box" style="background: #f8fafc;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#212121" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
                        <line x1="12" y1="18" x2="12.01" y2="18"></line>
                    </svg>
                </div>
                <span class="category-label">Mobiles</span>
            </div>

            <!-- 4. Electronics -->
            <div class="category-item" data-category="Electronics">
                <div class="category-icon-box" style="background: #f8fafc;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#212121" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="4" width="18" height="12" rx="2"></rect>
                        <path d="M2 20h20"></path>
                    </svg>
                </div>
                <span class="category-label">Electronics</span>
            </div>

            <!-- 5. Beauty -->
            <div class="category-item" data-category="Beauty">
                <div class="category-icon-box" style="background: #f8fafc;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#212121" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 11l3-8 3 8"></path>
                        <path d="M8 11h8v10H8z"></path>
                        <line x1="12" y1="15" x2="12" y2="18"></line>
                    </svg>
                </div>
                <span class="category-label">Beauty</span>
            </div>

            <!-- 6. Home -->
            <div class="category-item" data-category="Home">
                <div class="category-icon-box" style="background: #f8fafc;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#212121" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>
                </div>
                <span class="category-label">Home</span>
            </div>
        </nav>

        <!-- Hero Sale Banner (Exact from IMG_1694.jpg) -->
        <section class="hero-banner-container">
            <div class="hero-banner-card">
                <img src="./assets/images/bbd_banner_top_deals.svg" 
                     alt="Top BBD deals - From ₹8,699*" 
                     class="hero-banner-img"
                     loading="eager"
                     decoding="async">
            </div>
        </section>

        <!-- Carousel Indicator Dots (8 dots with 2nd dot active pill as in IMG_1694.jpg) -->
        <div class="hero-carousel-dots">
            <span class="carousel-dot"></span>
            <span class="carousel-dot active"></span>
            <span class="carousel-dot"></span>
            <span class="carousel-dot"></span>
            <span class="carousel-dot"></span>
            <span class="carousel-dot"></span>
            <span class="carousel-dot"></span>
            <span class="carousel-dot"></span>
        </div>

        <!-- Top Deals On Tech Card (Exact from IMG_1694.jpg) -->
        <section class="top-deals-tech-section">
            <div class="top-deals-tech-card">
                <div class="tech-header-row">
                    <h2 class="tech-title">Top deals on tech</h2>
                    <!-- BBD Seal Badge -->
                    <div class="tech-bbd-seal">
                        <svg width="44" height="44" viewBox="0 0 100 100">
                            <circle cx="50" cy="50" r="46" fill="#ffe000" stroke="#ffffff" stroke-width="3"/>
                            <circle cx="50" cy="50" r="40" fill="none" stroke="#2874f0" stroke-width="2" stroke-dasharray="4 2"/>
                            <text x="50" y="34" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="900" fill="#1e3a8a" text-anchor="middle">THE</text>
                            <text x="50" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="900" fill="#1e3a8a" text-anchor="middle">BIG</text>
                            <text x="50" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="900" fill="#1e3a8a" text-anchor="middle">BILLION</text>
                            <text x="50" y="84" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="900" fill="#1e3a8a" text-anchor="middle">DAYS</text>
                        </svg>
                    </div>
                </div>

                <div class="tech-cards-grid">
                    <!-- 1. Galaxy A36 5G -->
                    <div class="tech-item-card" onclick="window.location.href='product-detail.html?id=113'">
                        <img src="./assets/images/tech_phone_card.svg" alt="Galaxy A36 5G">
                    </div>
                    <!-- 2. HP Laptop Intel Core i5 -->
                    <div class="tech-item-card" onclick="window.location.href='product-detail.html?id=1'">
                        <img src="./assets/images/tech_laptop_card.svg" alt="HP Laptop Intel Core i5">
                    </div>
                    <!-- 3. LG Nano 4K UHD AI 2026 TV -->
                    <div class="tech-item-card" onclick="window.location.href='product-detail.html?id=2'">
                        <img src="./assets/images/tech_tv_card.svg" alt="LG Nano 4K UHD AI TV">
                    </div>
                </div>
            </div>
        </section>

        <!-- Festive Fashion Showcase: Men, Women, Kids -->
        <section class="fashion-categories-strip" id="fashion-strip">
            <div class="fashion-cat-card" data-category="Men">
                <div class="fashion-cat-avatar">
                    <img src="./assets/images/cat_men.jpg" 
                         alt="Men" 
                         loading="eager"
                         decoding="async"
                         onerror="if(!this._tried){this._tried=1; this.src='./assets/images/real/cat_men.jpg';}">
                </div>
                <span class="fashion-cat-title">Men</span>
                <span class="fashion-cat-offer">Min. 70% Off</span>
            </div>
            <div class="fashion-cat-card" data-category="Women">
                <div class="fashion-cat-avatar">
                    <img src="./assets/images/cat_women.jpg" 
                         alt="Women" 
                         loading="eager"
                         decoding="async"
                         onerror="if(!this._tried){this._tried=1; this.src='./assets/images/real/cat_women.jpg';}">
                </div>
                <span class="fashion-cat-title">Women</span>
                <span class="fashion-cat-offer">Min. 80% Off</span>
            </div>
            <div class="fashion-cat-card" data-category="Kids">
                <div class="fashion-cat-avatar">
                    <img src="./assets/images/cat_kids.jpg" 
                         alt="Kids" 
                         loading="eager"
                         decoding="async"
                         onerror="if(!this._tried){this._tried=1; this.src='./assets/images/real/cat_kids.jpg';}">
                </div>
                <span class="fashion-cat-title">Kids</span>
                <span class="fashion-cat-offer">Under ₹299</span>
            </div>
        </section>

        <!-- Section Divider -->
        <div class="section-divider-bar"></div>

        <!-- Products Grid Section (All 114 CSV Products Live) -->
        <section class="product-grid-section">
            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; padding: 2px 4px;">
                <div>
                    <h2 style="font-size: 16px; font-weight: 700; color: #212121; margin: 0; line-height: 1.2;">Deals of the Day</h2>
                    <span style="font-size: 11px; color: #878787;">Flipkart Assured • Big Billion Days Kitchen Sale</span>
                </div>
                <span id="product-count-badge" style="font-size: 12px; color: #2874f0; font-weight: 700; background: #e3edfe; padding: 3px 8px; border-radius: 4px;">54 Kitchen Products</span>
            </div>
            <div id="product-grid-container" class="product-grid"></div>
        </section>

        <!-- Bottom Navigation Bar (4 Fixed Tabs: Home, Categories, Account, Cart) -->
        <nav class="bottom-nav-bar">
            <a href="index.html" class="nav-item active">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="#2874f0">
                    <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
                </svg>
                <span class="nav-label">Home</span>
            </a>
            <a href="categories.html" class="nav-item">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="7" height="7"></rect>
                    <rect x="14" y="3" width="7" height="7"></rect>
                    <rect x="14" y="14" width="7" height="7"></rect>
                    <rect x="3" y="14" width="7" height="7"></rect>
                </svg>
                <span class="nav-label">Categories</span>
            </a>
            <a href="account.html" class="nav-item">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
                <span class="nav-label">Account</span>
            </a>
            <a href="cart.html" class="nav-item">
                <div style="position: relative; display: flex; align-items: center; justify-content: center;">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="9" cy="21" r="1"></circle>
                        <circle cx="20" cy="21" r="1"></circle>
                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                    </svg>
                    <span id="bottom-cart-badge" class="bottom-cart-badge" style="display: none;">0</span>
                </div>
                <span class="nav-label">Cart</span>
            </a>
        </nav>

        <!-- Toast Notice for Wishlist / Actions -->
        <div id="toast" class="toast-notice">Added to Wishlist</div>
    </div>

    <script defer src="./preview-products.js"></script>
</body>

</html>
