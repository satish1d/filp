<!DOCTYPE html>
<html lang="en-IN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#ebf3fe" id="themeColor">
    <title>Flipkart - The Big Billion Days Sale</title>
    <meta name="description" content="Explore The Big Billion Days deals on Flipkart. Live sale discounts on Mobiles, Electronics, Home, and Fashion.">
    <meta property="og:title" content="Flipkart - The Big Billion Days Sale">
    <meta property="og:description" content="Explore The Big Billion Days deals on Flipkart. Live sale discounts on Mobiles, Electronics, Home, and Fashion.">
    
    <link rel="stylesheet" href="./assets/css/custom.css">
</head>

<body>
    <div id="app-container">
        <!-- Top Sky-Blue Header Section -->
        <header class="top-header-section">
            <!-- Brand Switcher Tabs (Flipkart / Travel) -->
            <div class="brand-switcher-tabs">
                <button class="brand-tab flipkart-tab" id="tab-flipkart" aria-label="Flipkart">
                    <img src="./assets/images/flipkart_f_logo.svg" alt="Flipkart" class="tab-icon-top">
                    <span class="tab-text-bottom">Flipkart</span>
                </button>

                <button class="brand-tab travel-tab" id="tab-travel" aria-label="Travel">
                    <svg class="tab-icon-top travel-airplane-icon" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z" fill="#f05537"/>
                    </svg>
                    <span class="tab-text-bottom">Travel</span>
                </button>
            </div>

            <!-- Search Bar -->
            <div class="search-bar-wrapper">
                <div class="search-icon-pos">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2874f0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </div>
                <input type="text" id="search-input" class="search-input-box" placeholder="Search for Product" autocomplete="off">
            </div>
        </header>

        <!-- Category Navigation Strip -->
        <nav class="category-nav-strip" id="category-nav">
            <!-- 1. For You -->
            <div class="category-item active" data-category="all">
                <div class="category-icon-box">
                    <svg width="28" height="28" viewBox="0 0 32 32" fill="none">
                        <rect x="2" y="5" width="28" height="24" rx="7" fill="#2874f0"/>
                        <path d="M11 11C11 8.24 13.24 6 16 6C18.76 6 21 8.24 21 11" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
                        <path d="M10 18C12 21 20 21 22 18" stroke="#ffe11b" stroke-width="2.4" stroke-linecap="round"/>
                    </svg>
                </div>
                <span class="category-label">For You</span>
            </div>

            <!-- 2. Fashion -->
            <div class="category-item" data-category="Fashion">
                <div class="category-icon-box">
                    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20.38 3.46L16 2a4 4 0 01-8 0L3.62 3.46a2 2 0 00-1.34 2.23l.58 3.47a1 1 0 00.99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 002-2V10h2.15a1 1 0 00.99-.84l.58-3.47a2 2 0 00-1.34-2.23z"/>
                    </svg>
                </div>
                <span class="category-label">Fashion</span>
            </div>

            <!-- 3. Mobiles -->
            <div class="category-item" data-category="Mobiles">
                <div class="category-icon-box">
                    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
                        <line x1="12" y1="18" x2="12.01" y2="18"></line>
                    </svg>
                </div>
                <span class="category-label">Mobiles</span>
            </div>

            <!-- 4. Beauty -->
            <div class="category-item" data-category="Beauty">
                <div class="category-icon-box">
                    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 11l3-8 3 8"></path>
                        <path d="M8 11h8v10H8z"></path>
                        <line x1="12" y1="15" x2="12" y2="18"></line>
                    </svg>
                </div>
                <span class="category-label">Beauty</span>
            </div>

            <!-- 5. Electroni.. -->
            <div class="category-item" data-category="Electronics">
                <div class="category-icon-box">
                    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="4" width="18" height="12" rx="2"></rect>
                        <path d="M2 20h20"></path>
                    </svg>
                </div>
                <span class="category-label">Electroni..</span>
            </div>

            <!-- 6. Home -->
            <div class="category-item" data-category="Home">
                <div class="category-icon-box">
                    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>
                </div>
                <span class="category-label">Home</span>
            </div>
        </nav>

        <!-- Hero Sale Banner -->
        <section class="hero-banner-container">
            <div class="hero-banner-card">
                <img src="./assets/images/bbd_banner_official.jpg" 
                     srcset="./assets/images/bbd_banner_official.jpg 1x, ./assets/images/real/bbd_banner_real.jpg 2x"
                     alt="The Big Billion Days - Starts 9th Oct" 
                     class="hero-banner-img"
                     loading="eager"
                     onerror="this.onerror=null; this.src='./assets/images/real/bbd_banner_real.jpg';">
            </div>
        </section>

        <!-- Festive Fashion Showcase: Men, Women, Kids -->
        <section class="fashion-categories-strip" id="fashion-strip">
            <div class="fashion-cat-card" data-category="Men">
                <div class="fashion-cat-avatar">
                    <img src="./assets/images/real/cat_men.jpg" alt="Men" loading="lazy">
                </div>
                <span class="fashion-cat-title">Men</span>
                <span class="fashion-cat-offer">Min. 70% Off</span>
            </div>
            <div class="fashion-cat-card" data-category="Women">
                <div class="fashion-cat-avatar">
                    <img src="./assets/images/real/cat_women.jpg" alt="Women" loading="lazy">
                </div>
                <span class="fashion-cat-title">Women</span>
                <span class="fashion-cat-offer">Min. 80% Off</span>
            </div>
            <div class="fashion-cat-card" data-category="Kids">
                <div class="fashion-cat-avatar">
                    <img src="./assets/images/real/cat_kids.jpg" alt="Kids" loading="lazy">
                </div>
                <span class="fashion-cat-title">Kids</span>
                <span class="fashion-cat-offer">Under ₹299</span>
            </div>
        </section>

        <!-- Live Sale Section & Countdown Timer -->
        <section class="live-sale-section">
            <h2 class="live-sale-heading">Live Sale : <span class="live-sale-timer" id="countdown-timer">2min 41sec</span></h2>
            <p class="live-sale-viewers" id="viewers-count">14,352 People watching this sale</p>
        </section>

        <!-- Section Divider -->
        <div class="section-divider-bar"></div>

        <!-- Product Grid (2 Columns) -->
        <main class="product-grid-section">
            <div class="product-grid" id="product-grid-container">
                <!-- Dynamically populated via preview-products.js -->
            </div>
        </main>

        <!-- Toast Notice for Wishlist / Actions -->
        <div id="toast" class="toast-notice">Added to Wishlist</div>
    </div>

    <script defer src="./preview-products.js"></script>
</body>

</html>
